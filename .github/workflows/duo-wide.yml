# Runs DuoWideLayoutTests on the iPhone Duo's simulator, built with Xcode 27. They show the real main screen in windows
# the size of the Duo's inner screen and write down the width of each column and the place of each button, with a
# picture of each step. The facts are the lines that start with FACTS, printed at the end of the job's log.
# Runs by hand, or when this file or the test changes. It isn't part of every pull request, and the App workflow runs
# the same test on an iPad as part of all the tests.
name: Duo wide layout

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/duo-wide.yml"
      - "Tests/AppTests/DuoWideLayoutTests.swift"

concurrency:
  group: duo-wide-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wide:
    name: Wide layout on the iPhone Duo simulator
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Xcode version
        run: xcodebuild -version

      - name: Find the iPhone Duo simulator
        id: simulator
        run: |
          udid=$(python3 tools/pick_simulator.py Duo)
          [ -n "$udid" ] || { echo "No iPhone Duo simulator found"; exit 1; }
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Boot the Duo
        run: |
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b
          sleep 20

      - name: Wide layout tests on the Duo
        run: |
          udid="${{ steps.simulator.outputs.udid }}"
          bundle="$RUNNER_TEMP/Wide-Duo.xcresult"
          set +e
          xcodebuild test -quiet \
            -project Lamplight.xcodeproj \
            -scheme Lamplight \
            -destination "platform=iOS Simulator,id=$udid" \
            -only-testing:LamplightTests/DuoWideLayoutTests \
            -resultBundlePath "$bundle" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "FACTS|error:|\*\* "
          status=${PIPESTATUS[0]}
          set -e
          [ -d "$bundle" ] || { echo "No test results. The build probably failed."; tail -60 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }
          xcrun xcresulttool get test-results summary --path "$bundle" > "$RUNNER_TEMP/wide.json"
          python3 - "$RUNNER_TEMP/wide.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1]))
          for failure in summary.get("testFailures", []):
              print(f"FAILED {failure.get('testName')}:\n{failure.get('failureText')}\n")
          print(f"Wide layout tests on the Duo: {summary.get('totalTestCount')} total, {summary.get('passedTests')} passed, {summary.get('failedTests')} failed, {summary.get('skippedTests')} skipped")
          PY
          out="$RUNNER_TEMP/screens/DuoWide"
          mkdir -p "$out"
          xcrun xcresulttool export attachments --path "$bundle" --output-path "$out" || echo "Couldn't export the pictures."
          python3 tools/name_test_pictures.py "$out" > /dev/null || echo "Couldn't name the pictures."
          echo "=== FACTS ==="
          grep -h "^FACTS" "$out"/*facts*.txt 2>/dev/null || echo "No facts were kept."
          exit $status

      - name: Keep the pictures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: duo-wide-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: warn
          retention-days: 14
