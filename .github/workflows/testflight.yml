# Builds Lamplight for a real device, signs it and uploads it to TestFlight. No Mac of your own is needed.
# It only runs when started by hand: Actions, then TestFlight, then "Run workflow". macOS runners on a private
# repository use minutes at ten times the Linux rate, so don't add a trigger that runs it by itself.
#
# It needs three repository secrets (Settings, Secrets and variables, Actions), from an App Store Connect API
# key with the Admin role:
#   ASC_KEY_ID      the key's ID
#   ASC_ISSUER_ID   the Issuer ID shown above the list of keys
#   ASC_KEY_P8      the whole text of the .p8 file, with its BEGIN and END lines
# The steps are in docs/TESTFLIGHT.md.
name: TestFlight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: Build and upload
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the secrets are there
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is not set. See docs/TESTFLIGHT.md."
              missing=1
            fi
          done
          exit $missing

      - name: Write the API key to a file
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          key="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          grep -q "BEGIN PRIVATE KEY" "$key" || { echo "::error::ASC_KEY_P8 doesn't look like a .p8 file. Paste the whole file, with its BEGIN and END lines."; exit 1; }
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      # Apple refuses a build number that isn't higher than the last one. The date and time, in UTC, always is,
      # and nothing has to be committed. project.yml keeps its own number for builds made in Xcode.
      - name: Pick the build number
        run: |
          build=$(date -u +%Y%m%d%H%M)
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          echo "Build number $build"

      - name: Xcode version
        run: xcodebuild -version

      # The archive is left unsigned. Signing it here would need a development profile, and Apple only makes one
      # for a team with a registered device. The next step signs it for distribution, which needs no device.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive -quiet \
            -project Lamplight.xcodeproj \
            -scheme Lamplight \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Lamplight.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Sign and upload to TestFlight
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>U8LGQ38JST</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Lamplight.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build $BUILD_NUMBER. It shows in TestFlight once Apple has finished processing it."

      # xcodebuild writes why signing or the upload failed to these logs, not to the screen.
      - name: Show the export logs if it failed
        if: failure()
        run: |
          for log in "$RUNNER_TEMP"/export/*.log "$RUNNER_TEMP"/export/Packaging.log /var/folders/*/*/T/Lamplight_*.xcdistributionlogs/*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            tail -n 150 "$log"
            echo "::endgroup::"
          done

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
