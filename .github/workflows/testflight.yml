# Builds Lamplight for a real device, signs it and uploads it to TestFlight. No Mac of your own is needed.
# It only runs when started by hand: Actions, then TestFlight, then "Run workflow". macOS runners on a private
# repository use minutes at ten times the Linux rate, so don't add a trigger that runs it by itself.
#
# It needs three repository secrets (Settings, Secrets and variables, Actions), from an App Store Connect API
# key with the Admin role:
#   ASC_KEY_ID      the key's ID
#   ASC_ISSUER_ID   the Issuer ID shown above the list of keys
#   ASC_KEY_P8      the whole text of the .p8 file, with its BEGIN and END lines
# The steps are in docs/TESTFLIGHT.md.
name: TestFlight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: Build and upload
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the secrets are there
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is not set. See docs/TESTFLIGHT.md."
              missing=1
            fi
          done
          exit $missing

      # A secret pasted on a phone often carries a space or a line break. Those are taken out here, and an ID of
      # the wrong shape is refused with a plain message. The cleaned IDs are what the later steps use.
      - name: Check the IDs and write the API key to a file
        run: |
          key_id=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          issuer_id=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          echo "::add-mask::$key_id"
          echo "::add-mask::$issuer_id"
          bad=0
          if ! printf '%s' "$key_id" | grep -Eq '^[A-Za-z0-9]{8,14}$'; then
            echo "::error::ASC_KEY_ID should be only the Key ID: about ten letters and digits, with nothing else. It has ${#key_id} characters after spaces are removed."
            bad=1
          fi
          if ! printf '%s' "$issuer_id" | grep -Eq '^[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$'; then
            echo "::error::ASC_ISSUER_ID should be only the Issuer ID: 36 characters, like 12345678-abcd-abcd-abcd-1234567890ab. It has ${#issuer_id} characters after spaces are removed."
            bad=1
          fi
          # The key file is rebuilt from its letters, so a paste that lost its line breaks, gained spaces or had
          # its dashes changed by the keyboard still makes a file Xcode can read.
          mkdir -p "$RUNNER_TEMP/keys"
          key="$RUNNER_TEMP/keys/AuthKey.p8"
          body=$(printf '%s' "$ASC_KEY_P8" | sed -e 's/BEGIN PRIVATE KEY//g' -e 's/END PRIVATE KEY//g' | LC_ALL=C tr -cd 'A-Za-z0-9+/=')
          {
            echo "-----BEGIN PRIVATE KEY-----"
            printf '%s\n' "$body" | fold -w 64
            echo "-----END PRIVATE KEY-----"
          } > "$key"
          chmod 600 "$key"
          if ! openssl pkey -in "$key" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 is not a usable key. It has ${#body} letters between its BEGIN and END lines, and a .p8 file has about 200. Save the secret again with the whole text of the .p8 file."
            bad=1
          fi
          [ "$bad" -eq 0 ] || exit 1
          {
            echo "KEY_ID=$key_id"
            echo "ISSUER_ID=$issuer_id"
            echo "ASC_KEY_PATH=$key"
          } >> "$GITHUB_ENV"

      # Apple refuses a build number that isn't higher than the last one. The date and time, in UTC, always is,
      # and nothing has to be committed. project.yml keeps its own number for builds made in Xcode.
      - name: Pick the build number
        run: |
          build=$(date -u +%Y%m%d%H%M)
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          echo "Build number $build"

      - name: Xcode version
        run: xcodebuild -version

      # The archive is left unsigned. Signing it here would need a development profile, and Apple only makes one
      # for a team with a registered device. The next step signs it for distribution, which needs no device.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive -quiet \
            -project Lamplight.xcodeproj \
            -scheme Lamplight \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Lamplight.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Sign and upload to TestFlight
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>U8LGQ38JST</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Lamplight.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Uploaded build $BUILD_NUMBER. It shows in TestFlight once Apple has finished processing it."

      # xcodebuild writes why signing or the upload failed to these logs, not to the screen.
      - name: Show the export logs if it failed
        if: failure()
        run: |
          for log in "$RUNNER_TEMP"/export/*.log "$RUNNER_TEMP"/export/Packaging.log /var/folders/*/*/T/Lamplight_*.xcdistributionlogs/*.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            tail -n 150 "$log"
            echo "::endgroup::"
          done

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
