# Builds the app and runs the tests in the iPad simulator. This is the only place the SwiftUI and UIKit code
# in App/ gets compiled outside Xcode. macOS runners on a private repository use minutes at ten times the
# Linux rate, so this only runs on pull requests that change code, and a newer push cancels the older run.
# Run it by hand from the Actions tab with "Run workflow".
name: App

on:
  pull_request:
    paths:
      - "App/**"
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "project.yml"
      - "Lamplight.xcodeproj/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Xcode version
        run: xcodebuild -version

      - name: Find an iPad simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          for runtime in sorted(runtimes, reverse=True):
              for device in runtimes[runtime]:
                  if device["name"].startswith("iPad"):
                      print(device["udid"])
                      sys.exit()
          sys.exit("No iPad simulator found")
          ')
          [ -n "$udid" ] || { echo "No iPad simulator found"; exit 1; }
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing -quiet \
            -project Lamplight.xcodeproj \
            -scheme Lamplight \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO

      # The photo picker tests look in a real Photos library, so the app has to be allowed to read it. Changing what an
      # app may read kills it if it is running, and a fresh install clears it, so: one small run first, to have the app
      # installed the way the tests install it; then the grant, while nothing is running; then the whole run.
      - name: Test
        env:
          # The test runner hands this on to the tests as REQUIRE_PHOTOS.
          TEST_RUNNER_REQUIRE_PHOTOS: "1"
        run: |
          set -o pipefail
          udid="${{ steps.simulator.outputs.udid }}"
          bundle=com.forageandjump.lamplight
          tcc="$HOME/Library/Developer/CoreSimulator/Devices/$udid/data/Library/TCC/TCC.db"
          show() {
            echo "-- $1"
            sqlite3 "$tcc" "select service, client, auth_value from access where client like '%lamplight%'" || true
            xcrun simctl get_app_container "$udid" "$bundle" data || true
          }
          echo "-- how the app is signed"
          codesign -dvv "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/Lamplight.app" 2>&1 | grep -E "Identifier|Signature|Authority|TeamIdentifier" || true
          run_tests() {
            xcodebuild test-without-building -quiet \
              -project Lamplight.xcodeproj \
              -scheme Lamplight \
              -destination "platform=iOS Simulator,id=$udid" \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO "$@"
          }
          xcrun simctl bootstatus "$udid" -b
          run_tests -only-testing:LamplightTests/BoundedWaitTests/testReturnsWhatTheWorkReturns
          show "after the small run"
          xcrun simctl privacy "$udid" grant photos "$bundle"
          show "after the grant"
          set +e
          run_tests -resultBundlePath "$RUNNER_TEMP/Lamplight.xcresult"
          status=$?
          show "after the whole run"
          exit $status

      # -quiet prints nothing when everything passes, so say how many tests ran. Zero tests would be a silent pass.
      # When tests fail, show why: -quiet leaves the failure text out of the log.
      - name: Test results
        if: ${{ !cancelled() }}
        run: |
          bundle="$RUNNER_TEMP/Lamplight.xcresult"
          [ -d "$bundle" ] || { echo "No test results. The build failed before the tests ran."; exit 0; }
          xcrun xcresulttool get test-results summary --path "$bundle" > "$RUNNER_TEMP/summary.json"
          python3 - "$RUNNER_TEMP/summary.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1]))
          for failure in summary.get("testFailures", []):
              print(f"FAILED {failure.get('testName')}:\n{failure.get('failureText')}\n")
          total = summary.get("totalTestCount")
          print(f"Tests: {total} total, {summary.get('passedTests')} passed, {summary.get('failedTests')} failed, {summary.get('skippedTests')} skipped")
          if not total:
              sys.exit("No tests ran.")
          PY
