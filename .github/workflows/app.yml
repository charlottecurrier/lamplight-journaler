# Builds the app and runs the tests in the iPad simulator. This is the only place the SwiftUI and UIKit code
# in App/ gets compiled outside Xcode. macOS runners on a private repository use minutes at ten times the
# Linux rate, so this only runs on pull requests that change code, and a newer push cancels the older run.
# Run it by hand from the Actions tab with "Run workflow".
name: App

on:
  pull_request:
    paths:
      - "App/**"
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "project.yml"
      - "Lamplight.xcodeproj/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Xcode version
        run: xcodebuild -version

      - name: Find an iPad simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          for runtime in sorted(runtimes, reverse=True):
              for device in runtimes[runtime]:
                  if device["name"].startswith("iPad"):
                      print(device["udid"])
                      sys.exit()
          sys.exit("No iPad simulator found")
          ')
          [ -n "$udid" ] || { echo "No iPad simulator found"; exit 1; }
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test -quiet \
            -project Lamplight.xcodeproj \
            -scheme Lamplight \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/Lamplight.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      # -quiet prints nothing when everything passes, so say how many tests ran. Zero tests would be a silent pass.
      # When tests fail, show why: -quiet leaves the failure text out of the log.
      - name: Test results
        if: ${{ !cancelled() }}
        run: |
          bundle="$RUNNER_TEMP/Lamplight.xcresult"
          [ -d "$bundle" ] || { echo "No test results. The build failed before the tests ran."; exit 0; }
          xcrun xcresulttool get test-results summary --path "$bundle" > "$RUNNER_TEMP/summary.json"
          python3 - "$RUNNER_TEMP/summary.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1]))
          for failure in summary.get("testFailures", []):
              print(f"FAILED {failure.get('testName')}:\n{failure.get('failureText')}\n")
          total = summary.get("totalTestCount")
          print(f"Tests: {total} total, {summary.get('passedTests')} passed, {summary.get('failedTests')} failed, {summary.get('skippedTests')} skipped")
          if not total:
              sys.exit("No tests ran.")
          PY

      # The new-entry tests run once more on a phone, so the layout is a phone's own and not an iPad window made to
      # look like one. Same build, a different simulator, so it costs a boot and a short run.
      - name: Phone tests
        if: ${{ !cancelled() }}
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          for runtime in sorted(runtimes, reverse=True):
              for device in runtimes[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit()
          sys.exit("No iPhone simulator found")
          ')
          echo "Using simulator $udid"
          bundle="$RUNNER_TEMP/Phone.xcresult"
          set +e
          xcodebuild test-without-building -quiet \
            -project Lamplight.xcodeproj \
            -scheme Lamplight \
            -destination "platform=iOS Simulator,id=$udid" \
            -only-testing:LamplightTests/NewEntryNavigationTests \
            -resultBundlePath "$bundle" \
            CODE_SIGNING_ALLOWED=NO
          status=$?
          set -e
          [ -d "$bundle" ] || { echo "No test results from the phone."; exit 1; }
          xcrun xcresulttool get test-results summary --path "$bundle" > "$RUNNER_TEMP/phone.json"
          python3 - "$RUNNER_TEMP/phone.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1]))
          for failure in summary.get("testFailures", []):
              print(f"FAILED {failure.get('testName')}:\n{failure.get('failureText')}\n")
          total = summary.get("totalTestCount")
          print(f"Phone tests: {total} total, {summary.get('passedTests')} passed, {summary.get('failedTests')} failed, {summary.get('skippedTests')} skipped")
          if not total:
              sys.exit("No tests ran on the phone.")
          PY
          exit $status

      # The UI tests start the whole app and tap it, on a phone and on an iPad, and take a picture at each step.
      # They reuse the build above. A failure here doesn't hide the results of the tests before it.
      - name: UI tests
        if: ${{ !cancelled() }}
        run: |
          # With a hardware keyboard "connected", the simulator shows no keyboard and typing can fail.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          status=0
          for kind in iPhone iPad; do
            udid=$(xcrun simctl list devices available -j | KIND="$kind" python3 -c '
          import json, os, sys
          runtimes = json.load(sys.stdin)["devices"]
          for runtime in sorted(runtimes, reverse=True):
              for device in runtimes[runtime]:
                  if device["name"].startswith(os.environ["KIND"]):
                      print(device["udid"])
                      sys.exit()
          sys.exit("No simulator found")
          ')
            echo "UI tests on $kind simulator $udid"
            bundle="$RUNNER_TEMP/UI-$kind.xcresult"
            set +e
            xcodebuild test -quiet \
              -project Lamplight.xcodeproj \
              -scheme LamplightUITests \
              -destination "platform=iOS Simulator,id=$udid" \
              -resultBundlePath "$bundle" \
              CODE_SIGNING_ALLOWED=NO
            [ $? -eq 0 ] || status=1
            set -e
            [ -d "$bundle" ] || { echo "No UI test results on $kind."; status=1; continue; }
            xcrun xcresulttool get test-results summary --path "$bundle" > "$RUNNER_TEMP/ui-$kind.json"
            KIND="$kind" python3 - "$RUNNER_TEMP/ui-$kind.json" <<'PY'
          import json, os, sys
          summary = json.load(open(sys.argv[1]))
          for failure in summary.get("testFailures", []):
              print(f"FAILED {failure.get('testName')}:\n{failure.get('failureText')}\n")
          print(f"UI tests on {os.environ['KIND']}: {summary.get('totalTestCount')} total, {summary.get('passedTests')} passed, {summary.get('failedTests')} failed, {summary.get('skippedTests')} skipped")
          PY
            # The pictures come out named by number. Give them the names the tests gave them.
            out="$RUNNER_TEMP/screens/$kind"
            mkdir -p "$out"
            xcrun xcresulttool export attachments --path "$bundle" --output-path "$out" || echo "Couldn't export the pictures for $kind."
            python3 - "$out" <<'PY'
          import json, os, re, sys
          out = sys.argv[1]
          manifest = os.path.join(out, "manifest.json")
          if os.path.exists(manifest):
              for test in json.load(open(manifest)):
                  for item in test.get("attachments", []):
                      old = os.path.join(out, item.get("exportedFileName", ""))
                      name = item.get("suggestedHumanReadableName") or ""
                      if not os.path.isfile(old) or not name:
                          continue
                      stem, ext = os.path.splitext(name)
                      # The suggested name ends with a number and a long ID. Keep the part the test wrote.
                      stem = re.sub(r"_\d+_[0-9A-Fa-f-]{36}$", "", stem)
                      test_name = (test.get("testIdentifier") or "").split("/")[-1].replace("()", "")
                      new = os.path.join(out, re.sub(r"[^A-Za-z0-9 ._-]", "", f"{test_name} - {stem}{ext or '.png'}"))
                      if not os.path.exists(new):
                          os.rename(old, new)
          print(f"{len([f for f in os.listdir(out) if f.lower().endswith(('.png', '.jpg', '.jpeg', '.heic'))])} pictures in {out}")
          PY
          done
          exit $status

      - name: Keep the pictures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: warn
          retention-days: 14
