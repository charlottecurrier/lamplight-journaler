# Builds the app and runs the tests in simulators. This is the only place the SwiftUI and UIKit code in App/
# gets compiled outside Xcode. It runs on pull requests that change code, and a newer push cancels the older run.
# The repository is public, so GitHub doesn't charge for the Mac minutes. If it is ever made private again, they
# count ten times and one run is about fourteen minutes: take the pull_request trigger out then.
# It can also be run by hand from the Actions tab with "Run workflow".
name: App

on:
  pull_request:
    paths:
      - "App/**"
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "project.yml"
      - "Lamplight.xcodeproj/**"
      - ".github/workflows/app.yml"
      - "tools/name_test_pictures.py"
      - "tools/pick_simulator.py"
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Build and test
    # Xcode 27.1 or later is what lets the app fill the inner screen of the folding iPhone Duo.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Xcode version
        run: xcodebuild -version

      - name: Find an iPad simulator
        id: simulator
        run: |
          udid=$(python3 tools/pick_simulator.py iPad)
          [ -n "$udid" ] || { echo "No iPad simulator found"; exit 1; }
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          # Start it and wait until it has finished starting, as the Duo job does. Tests on a simulator that is
          # still starting up stall.
          xcrun simctl bootstatus "$udid" -b
          sleep 20

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test -quiet \
            -project Lamplight.xcodeproj \
            -scheme Lamplight \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/Lamplight.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      # -quiet prints nothing when everything passes, so say how many tests ran. Zero tests would be a silent pass.
      # When tests fail, show why: -quiet leaves the failure text out of the log.
      - name: Test results
        if: ${{ !cancelled() }}
        run: |
          bundle="$RUNNER_TEMP/Lamplight.xcresult"
          [ -d "$bundle" ] || { echo "No test results. The build failed before the tests ran."; exit 0; }
          xcrun xcresulttool get test-results summary --path "$bundle" > "$RUNNER_TEMP/summary.json"
          python3 - "$RUNNER_TEMP/summary.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1]))
          for failure in summary.get("testFailures", []):
              print(f"FAILED {failure.get('testName')}:\n{failure.get('failureText')}\n")
          total = summary.get("totalTestCount")
          print(f"Tests: {total} total, {summary.get('passedTests')} passed, {summary.get('failedTests')} failed, {summary.get('skippedTests')} skipped")
          if not total:
              sys.exit("No tests ran.")
          PY

      # Some of these tests take pictures of screens the UI tests can't reach, such as the loading screen.
      # A step of its own, so a failure in the results above doesn't lose them, and losing them fails nothing.
      - name: Pictures from the tests
        if: ${{ !cancelled() }}
        run: |
          bundle="$RUNNER_TEMP/Lamplight.xcresult"
          [ -d "$bundle" ] || exit 0
          out="$RUNNER_TEMP/screens/Pages"
          mkdir -p "$out"
          xcrun xcresulttool export attachments --path "$bundle" --output-path "$out" || echo "Couldn't export the pictures."
          python3 tools/name_test_pictures.py "$out" || echo "Couldn't name the pictures."

      # The new-entry tests run once more on a phone, so the layout is a phone's own and not an iPad window made to
      # look like one. Same build, a different simulator, so it costs a boot and a short run.
      - name: Phone tests
        if: ${{ !cancelled() }}
        run: |
          # One simulator at a time. The runner has 7 GB, and a second simulator left running starves the first.
          xcrun simctl shutdown all || true
          udid=$(python3 tools/pick_simulator.py iPhone)
          echo "Using simulator $udid"
          xcrun simctl bootstatus "$udid" -b
          sleep 20
          bundle="$RUNNER_TEMP/Phone.xcresult"
          set +e
          xcodebuild test-without-building -quiet \
            -project Lamplight.xcodeproj \
            -scheme Lamplight \
            -destination "platform=iOS Simulator,id=$udid" \
            -only-testing:LamplightTests/NewEntryNavigationTests \
            -resultBundlePath "$bundle" \
            CODE_SIGNING_ALLOWED=NO
          status=$?
          set -e
          [ -d "$bundle" ] || { echo "No test results from the phone."; exit 1; }
          xcrun xcresulttool get test-results summary --path "$bundle" > "$RUNNER_TEMP/phone.json"
          python3 - "$RUNNER_TEMP/phone.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1]))
          for failure in summary.get("testFailures", []):
              print(f"FAILED {failure.get('testName')}:\n{failure.get('failureText')}\n")
          total = summary.get("totalTestCount")
          print(f"Phone tests: {total} total, {summary.get('passedTests')} passed, {summary.get('failedTests')} failed, {summary.get('skippedTests')} skipped")
          if not total:
              sys.exit("No tests ran on the phone.")
          PY
          exit $status

      # Kept even when the job ran out of time, since that is when they are most wanted.
      - name: Keep the pictures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: warn
          retention-days: 14

  # The UI tests start the whole app and tap it, on a phone and on an iPad, and take a picture at each step.
  # Each runs in a job of its own, on a machine of its own, the way the Duo job does. In the same job as the tests
  # above they went wrong in five runs out of six on the xcode-27 runner (a stalled lookup, an app that couldn't be
  # quit, a test runner that never started) while the Duo job, alone on its machine, passed every time. Apart, a
  # stall here also can't hide or hold up the results above. It costs a second and third build.
  ui:
    name: UI tests (${{ matrix.kind }})
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kind: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v7

      - name: Find and start the simulator
        id: simulator
        run: |
          # With a hardware keyboard "connected", the simulator shows no keyboard and typing can fail.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          udid=$(python3 tools/pick_simulator.py "${{ matrix.kind }}")
          [ -n "$udid" ] || { echo "No ${{ matrix.kind }} simulator found"; exit 1; }
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          # Wait until it has finished starting. Tests on a simulator that is still starting up stall.
          xcrun simctl bootstatus "$udid" -b
          sleep 20

      # Each test gets five minutes. A simulator once hung starting the app and used up the job's time, which left
      # no result and no pictures. With a limit, that test fails and the rest still run.
      - name: UI tests
        run: |
          kind="${{ matrix.kind }}"
          udid="${{ steps.simulator.outputs.udid }}"
          bundle="$RUNNER_TEMP/UI-$kind.xcresult"
          built="$RUNNER_TEMP/built"
          xcodebuild build-for-testing -quiet \
            -project Lamplight.xcodeproj \
            -scheme LamplightUITests \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath "$built" \
            CODE_SIGNING_ALLOWED=NO
          # Start the app once before the tests. The first start on a new simulator is slow, and the first test's
          # launch timed out waiting for it. If this warm-up fails, the tests still run and say what is wrong.
          app="$built/Build/Products/Debug-iphonesimulator/Lamplight.app"
          xcrun simctl install "$udid" "$app" || echo "Couldn't install the app for the warm-up."
          xcrun simctl launch "$udid" com.forageandjump.lamplight \
            -storage.mode local -prefs.onboardingComplete YES -prefs.lockEnabled NO -prefs.openToNewEntry NO \
            || echo "Couldn't start the app for the warm-up."
          sleep 30
          xcrun simctl terminate "$udid" com.forageandjump.lamplight || true
          set +e
          xcodebuild test-without-building -quiet \
            -project Lamplight.xcodeproj \
            -scheme LamplightUITests \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath "$built" \
            -resultBundlePath "$bundle" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO
          status=$?
          set -e
          [ -d "$bundle" ] || { echo "No UI test results on $kind."; exit 1; }
          xcrun xcresulttool get test-results summary --path "$bundle" > "$RUNNER_TEMP/ui-$kind.json"
          KIND="$kind" python3 - "$RUNNER_TEMP/ui-$kind.json" <<'PY'
          import json, os, sys
          summary = json.load(open(sys.argv[1]))
          for failure in summary.get("testFailures", []):
              print(f"FAILED {failure.get('testName')}:\n{failure.get('failureText')}\n")
          total = summary.get("totalTestCount")
          print(f"UI tests on {os.environ['KIND']}: {total} total, {summary.get('passedTests')} passed, {summary.get('failedTests')} failed, {summary.get('skippedTests')} skipped")
          if not total:
              sys.exit("No UI tests ran.")
          PY
          # The pictures come out named by number. Give them the names the tests gave them.
          out="$RUNNER_TEMP/screens/$kind"
          mkdir -p "$out"
          xcrun xcresulttool export attachments --path "$bundle" --output-path "$out" || echo "Couldn't export the pictures for $kind."
          python3 tools/name_test_pictures.py "$out" || echo "Couldn't name the pictures."
          exit $status

      - name: Keep the pictures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ matrix.kind }}
          path: ${{ runner.temp }}/screens
          if-no-files-found: warn
          retention-days: 14
