# Runs the app's UI tests on the iPhone Duo's simulator, built with Xcode 27, and keeps what they saw: pictures, and the
# size of the screen and the place of each button in the log (lines that start with FACTS).
# Runs by hand, or when this file or the facts test changes. It isn't part of every pull request.
name: Duo

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/duo.yml"
      - "Tests/UITests/ScreenFactsTests.swift"
      - "tools/pick_simulator.py"

permissions:
  contents: read

jobs:
  duo:
    name: iPhone Duo simulator
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Xcode version
        run: xcodebuild -version

      - name: Find the iPhone Duo simulator
        id: simulator
        run: |
          udid=$(python3 tools/pick_simulator.py Duo)
          [ -n "$udid" ] || { echo "No iPhone Duo simulator found"; exit 1; }
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # The first run crashed while the test runner was starting up, on a simulator that had just been asked to boot.
      # Boot it first and wait until it has finished.
      - name: Boot the Duo
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b
          sleep 20
          xcrun simctl list devices | grep -i "iPhone Duo" || true

      - name: UI tests on the Duo
        run: |
          udid="${{ steps.simulator.outputs.udid }}"
          bundle="$RUNNER_TEMP/UI-Duo.xcresult"
          set +e
          xcodebuild test -quiet \
            -project Lamplight.xcodeproj \
            -scheme LamplightUITests \
            -destination "platform=iOS Simulator,id=$udid" \
            -resultBundlePath "$bundle" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "FACTS|error:|warning: .*(deprecated|unavailable)|\*\* " 
          status=${PIPESTATUS[0]}
          set -e
          [ -d "$bundle" ] || { echo "No UI test results. The build probably failed."; tail -60 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }
          xcrun xcresulttool get test-results summary --path "$bundle" > "$RUNNER_TEMP/ui-duo.json"
          python3 - "$RUNNER_TEMP/ui-duo.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1]))
          for failure in summary.get("testFailures", []):
              print(f"FAILED {failure.get('testName')}:\n{failure.get('failureText')}\n")
          print(f"UI tests on the Duo: {summary.get('totalTestCount')} total, {summary.get('passedTests')} passed, {summary.get('failedTests')} failed, {summary.get('skippedTests')} skipped")
          PY
          out="$RUNNER_TEMP/screens/Duo"
          mkdir -p "$out"
          xcrun xcresulttool export attachments --path "$bundle" --output-path "$out" || echo "Couldn't export the pictures."
          python3 tools/name_test_pictures.py "$out"
          # Print every FACTS line, from every screen the facts test looked at.
          grep -h "^FACTS" "$out"/*facts*.txt 2>/dev/null || true
          # If the test runner crashed, the crash log says where. Print the top of it.
          for crash in "$out"/*.ips; do
            [ -f "$crash" ] || continue
            echo "CRASH LOG $crash"
            head -c 6000 "$crash"
            echo
          done
          exit $status

      - name: Keep the pictures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: duo-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: warn
          retention-days: 14
